name: ci

# Compile-and-test only: nothing here publishes, so a red run on dev costs a
# notification instead of blocking a release. The point is that Windows stops
# being something we discover at tag time — it is compiled on every push.
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

# A new push supersedes the previous run: this is feedback, not a build to keep.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Same set as release.yml: pipewire 1.0 headers (24.04), alsa for
          # cpal, webkit/gtk for the Tauri shell, appindicator for the tray.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev pkg-config \
            libayatana-appindicator3-dev \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Rust tests
        run: cargo test --workspace --release --quiet

      - name: Svelte and TypeScript
        run: npm run check

  windows:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      # Build rather than test: the tests are about the mixer, not the platform,
      # and the useful signal here is that the Windows audio path (cpal) and the
      # Tauri shell actually link.
      - name: Rust build
        run: cargo build --workspace --release --quiet

      - name: Svelte and TypeScript
        run: npm run check
