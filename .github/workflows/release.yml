name: release

# Only on a version tag (or when started by hand from the Actions tab).
# Nothing runs for ordinary pushes to dev/main — those are just commits.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist, e.g. v0.1.4)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

# Never let two releases race for the same tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  linux:
    name: Linux (x86_64)
    # 24.04, not the oldest Ubuntu: audio-core links pipewire-rs with the v1_0_0
    # feature, and libspa-sys needs headers only PipeWire 1.0 provides
    # (spa_type_video_flags). Ubuntu 22.04 has 0.3.48, so the app cannot run
    # there anyway — building on 24.04 matches reality instead of pretending.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # webkit/gtk: the Tauri shell.
          # alsa + pipewire: cpal -> alsa-sys and pipewire-rs -> pipewire-sys are
          # linked into audio-core, so their headers must exist even though the
          # tests themselves do not touch a sound device.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev pkg-config \
            libayatana-appindicator3-dev \
            build-essential file wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target" # keyed per tag, keeps rebuilds ~2 min

      - run: npm ci

      - name: Check that the tag matches the app version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag version=$version"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match tauri.conf.json version $version — bump it first"
            exit 1
          fi

      - name: Build tests before shipping anything
        run: |
          cargo test --workspace --release --quiet
          npm run check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Wagmify ${{ inputs.tag || github.ref_name }}"
          # v0.x and any "-alpha/-beta/-rc" tag stay marked as a pre-release, so
          # the repository's "Latest" badge is only claimed by a real 1.0.
          prerelease: ${{ startsWith(inputs.tag || github.ref_name, 'v0.') || contains(inputs.tag || github.ref_name, '-') }}
          draft: ${{ inputs.draft || false }}
          releaseBody: |
            Download the asset for your platform:

            | file | who it's for | install |
            |---|---|---|
            | `*_amd64.deb` | Ubuntu / Debian / Mint / Pop!_OS | `sudo apt install ./Wagmify_*.deb` |
            | `*.x86_64.rpm` | Fedora / RHEL / openSUSE | `sudo dnf install ./Wagmify-*.rpm` |
            | `*.AppImage` | anything else, no root | `chmod +x Wagmify_*.AppImage && ./Wagmify_*.AppImage` |
            | `*_x64-setup.exe` | Windows 10/11, x64 | run the installer, then install **VB-CABLE** |

            **Linux** — pick **Soundboard Mic** as your input device in Discord and
            turn off Noise Suppression / Echo Cancellation / AGC there. Needs
            **PipeWire 1.0+** (Ubuntu 24.04 / Fedora 39 / Arch or newer; the build
            links glibc 2.39). `ffmpeg` and `yt-dlp` are optional, for video import
            and page links.

            **Windows** needs a virtual audio cable: Windows has no way for a
            user-space app to create an audio device. Install
            [VB-CABLE](https://vb-audio.com/Cable/) (free), set `Send to` to
            **CABLE Input**, and pick **CABLE Output** as the microphone in
            Discord. The Windows build is new — please report what breaks.

            Verify downloads with `sha256sum -c SHA256SUMS`.

            **Platforms** — Linux and Windows. macOS is implemented but has not run
            on real hardware yet.

      - name: Collect artifacts for the run page
        uses: actions/upload-artifact@v4
        with:
          name: wagmify-linux-${{ inputs.tag || github.ref_name }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    # Native build: cross-compiling from Linux needs the mingw toolchain, and the
    # Windows audio path (cpal) is only ever exercised for real on Windows.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - name: Check that the tag matches the app version
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          Write-Host "tag=$tag version=$version"
          if ("v$version" -ne $tag) {
            Write-Error "tag $tag does not match tauri.conf.json version $version — bump it first"
            exit 1
          }

      - name: Build tests before shipping anything
        run: |
          cargo test --workspace --release --quiet
          npm run check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # nsis only: the .msi needs WiX, and the .exe is what people expect.
          args: --bundles nsis
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Wagmify ${{ inputs.tag || github.ref_name }}"
          prerelease: ${{ startsWith(inputs.tag || github.ref_name, 'v0.') || contains(inputs.tag || github.ref_name, '-') }}
          draft: ${{ inputs.draft || false }}

      - name: Collect artifacts for the run page
        uses: actions/upload-artifact@v4
        with:
          name: wagmify-windows-${{ inputs.tag || github.ref_name }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # One checksum file for every platform, assembled from the release itself, so
  # it cannot drift from what was actually published.
  checksums:
    name: Checksums
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p assets && cd assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --clobber
          # Plain file names: whoever downloaded these has them side by side, so a
          # path -- or awk, which splits on spaces -- breaks `sha256sum -c`.
          : > SHA256SUMS
          for f in *.deb *.rpm *.AppImage *.exe *.msi; do
            [ -f "$f" ] && printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
