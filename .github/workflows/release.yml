name: release

# Only on a version tag (or when started by hand from the Actions tab).
# Nothing runs for ordinary pushes to dev/main — those are just commits.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist, e.g. v0.1.0)"
        required: true
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

# Never let two releases race for the same tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  linux:
    name: Linux (x86_64)
    # Pinned to 22.04 on purpose: the .deb/AppImage then link glibc 2.35 and run
    # on 22.04 and newer. Building on 24.04 would silently exclude those users.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # webkit/gtk: the Tauri shell.
          # alsa + pipewire: cpal -> alsa-sys and pipewire-rs -> pipewire-sys are
          # linked into audio-core, so their headers must exist even though the
          # tests themselves do not touch a sound device.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev pkg-config \
            build-essential file wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target" # keyed per tag, keeps rebuilds ~2 min

      - run: npm ci

      - name: Check that the tag matches the app version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag version=$version"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match tauri.conf.json version $version — bump it first"
            exit 1
          fi

      - name: Build tests before shipping anything
        run: |
          cargo test --workspace --release --quiet
          npm run check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Kakiri ${{ inputs.tag || github.ref_name }}"
          # v0.x and any "-alpha/-beta/-rc" tag stay marked as a pre-release, so
          # the repository's "Latest" badge is only claimed by a real 1.0.
          prerelease: ${{ startsWith(inputs.tag || github.ref_name, 'v0.') || contains(inputs.tag || github.ref_name, '-') }}
          draft: ${{ inputs.draft || false }}
          releaseBody: |
            Download the asset for your distribution:

            | file | who it's for | install |
            |---|---|---|
            | `*_amd64.deb` | Ubuntu / Debian / Mint / Pop!_OS | `sudo apt install ./Kakiri_*.deb` |
            | `*.x86_64.rpm` | Fedora / RHEL / openSUSE | `sudo dnf install ./Kakiri-*.rpm` |
            | `*.AppImage` | anything else, no root | `chmod +x Kakiri_*.AppImage && ./Kakiri_*.AppImage` |

            Then pick **Soundboard Mic** as your input device in Discord, and turn
            off Noise Suppression / Echo Cancellation / AGC there.

            Verify downloads with `sha256sum -c SHA256SUMS`.

            **Notes** — Linux only for now (the Windows/macOS audio path is not
            tested yet). Requires PipeWire (tested on Ubuntu 24.04); the build
            targets glibc 2.35+ (Ubuntu 22.04+). `ffmpeg` and `yt-dlp` are
            optional, for video import and page links.

      - name: Checksums
        run: |
          cd target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec sha256sum {} + | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: Attach checksums to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" \
            target/release/bundle/SHA256SUMS --clobber

      - name: Collect artifacts for the run page
        uses: actions/upload-artifact@v4
        with:
          name: kakiri-linux-${{ inputs.tag || github.ref_name }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS
          if-no-files-found: error

  # Windows and macOS stay switched off until their audio path has run on real
  # hardware. When it has, uncomment below — same free runner minutes, and the
  # assets land on the same release.
