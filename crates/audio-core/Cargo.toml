[package]
name = "audio-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
bytemuck = "1"
symphonia = { version = "0.6", features = ["mp3", "aac", "flac", "vorbis", "wav", "isomp4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v1_0_0"] }
rtrb = "0.4"

# `spike-routing` (src/bin/spike_routing.rs) is auto-discovered.
